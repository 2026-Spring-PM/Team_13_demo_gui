<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>농장 마을</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#1a3a2a;
      font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
    canvas{display:block;cursor:pointer;touch-action:none;position:absolute}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const cv=document.getElementById("game"),cx=cv.getContext("2d");
const FT='"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const FARM_DAY_SECONDS=300;
const FARM_SESSION_LANGUAGE_KEY="farmVillageSessionLanguage";
const DAILY_SUPPORT_GOLD=20;
const TRAINING_MAX_LEVEL=10;

/* === RESPONSIVE LANDSCAPE === */
let W,H,TL,CO,RO,sc=1;
function resize(){
  CO=28;RO=23;TL=36;W=CO*TL;H=RO*TL;
  cv.width=W;cv.height=H;
  const sx=innerWidth/W,sy=innerHeight/H;sc=Math.min(sx,sy);
  cv.style.width=(W*sc)+"px";cv.style.height=(H*sc)+"px";
  cv.style.left=((innerWidth-W*sc)/2)+"px";cv.style.top=((innerHeight-H*sc)/2)+"px";
}
resize();addEventListener("resize",resize);

/* === ASSETS === */
const AF={
  soil:"soil_tile.png",
  fence:"fence.png",
  house:"house.png",
  market:"market.png",workshop:"workshop.png",milk:"milk.png",egg:"egg.png",fleece:"fleece.png",
  cow:"cow.png",sheep:"sheep.png",chicken:"chicken.png",
  farmer:"farmer.png",battlePortal:"portal.png",
  iconPlant:"icon_plant.png",iconHarvest:"icon_harvest.png",
  iconBuy:"icon_buy.png",iconSell:"icon_sell.png",
  iconBattle:"icon_battle.png",iconNextDay:"icon_next_day.png",
  uiHud:"ui_hud_panel.png",uiEvent:"ui_event_banner.png",
  homeStart:"home_start_background.png",
  trainingScreen:"training_screen_bg.png",
  portalScreen:"portal_screen_bg.png",shopScreen:"shop_screen_bg.png",
  battleAtlas:"battle_character_atlas.png",
  heroFireBattle:"assets/generated/battle_actions/ch_00_0.png",
  heroWaterBattle:"assets/generated/battle_actions/ch_01_0.png",
  heroGrassBattle:"assets/generated/battle_actions/ch_02_0.png",
  heroFire:"assets/generated/hero_fire.png",heroWater:"assets/generated/hero_water.png",heroGrass:"assets/generated/hero_grass.png",
  fireBerry:"assets/generated/fire_berry.png",waterBerry:"assets/generated/water_berry.png",grassBerry:"assets/generated/grass_berry.png",
  fireApple:"assets/generated/fire_apple.png",waterApple:"assets/generated/water_apple.png",grassApple:"assets/generated/grass_apple.png",
  fireBerrySeed:"assets/generated/fire_berry_seed.png",waterBerrySeed:"assets/generated/water_berry_seed.png",grassBerrySeed:"assets/generated/grass_berry_seed.png",
  fireAppleSeed:"assets/generated/fire_apple_seed.png",waterAppleSeed:"assets/generated/water_apple_seed.png",grassAppleSeed:"assets/generated/grass_apple_seed.png"
};
const A={};for(const[k,f]of Object.entries(AF)){const i=new Image();i.src=f.includes("/")?`../${f}`:`../assets/generated/${f}`;A[k]=i;}
function iO(k){const i=A[k];return i&&i.complete&&i.naturalWidth>0;}
function dI(k,x,y,w,h,ax=.5,ay=.5,a=1){if(!iO(k))return false;cx.save();cx.globalAlpha=a;cx.drawImage(A[k],x-w*ax,y-h*ay,w,h);cx.restore();return true;}
function dILive(k,x,y,w,h,ax=.5,ay=.5,a=1,phase=0,power=1){
  if(!iO(k))return false;
  const bob=Math.sin(S.an*2.2+phase)*3*power,tilt=Math.sin(S.an*1.6+phase)*.035*power,breath=1+Math.sin(S.an*2.8+phase)*.025*power;
  cx.save();
  cx.globalAlpha=a;
  cx.translate(x,y+bob);
  cx.rotate(tilt);
  cx.scale(breath,1+(breath-1)*.55);
  cx.shadowColor="rgba(15,23,42,.24)";
  cx.shadowBlur=12*power;
  cx.shadowOffsetY=8*power;
  cx.drawImage(A[k],-w*ax,-h*ay,w,h);
  cx.restore();
  return true;
}
function dBattleHero(sprite,x,y,w,h,a=1,phase=0,power=1){
  if(!iO("battleAtlas"))return false;
  const img=A.battleAtlas,col=sprite%4,row=Math.floor(sprite/4);
  const sw=img.naturalWidth/4,sh=img.naturalHeight/4;
  const bob=Math.sin(S.an*2.4+phase)*3*power,tilt=Math.sin(S.an*1.7+phase)*.035*power,breath=1+Math.sin(S.an*2.9+phase)*.028*power;
  cx.save();
  cx.globalAlpha=a;
  cx.translate(x,y+bob);
  cx.rotate(tilt);
  cx.scale(breath,1+(breath-1)*.45);
  cx.shadowColor="rgba(15,23,42,.22)";
  cx.shadowBlur=12*power;
  cx.shadowOffsetY=8*power;
  cx.drawImage(img,col*sw,row*sh,sw,sh,-w*.5,-h*.72,w,h);
  cx.restore();
  return true;
}

/* === TILE MAP (28 cols 횞 18 rows, TL=36) ===
  COMPACT layout ??wide roads (3 tiles), zones close together, minimal walking.

  Row 0-1: HUD overlay area
  
  LAYOUT (approx):
  ?뚢???????????????????????????????????????
  ??[  FARM 8횞7  ]  R  [ TRAIN 5횞5 ]   ??
  ??              O     ??             ??
  ??              A  [ HOME 6횞5  ]     ??
  ??[ RANCH 5횞6 ] D  [ SHOP 6횞5  ]    ??
  ?붴???????????????????????????????????????
  
  Roads are 3 tiles wide for easy movement.
*/

const T={GRASS:0,ROAD:1,FARM:2,RANCH:3,TRAINING:4,HOME:5,SHOP:6,WATER:7};
const grid=Array.from({length:RO},()=>Array(CO).fill(T.GRASS));
function fG(r1,c1,r2,c2,t){for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(r>=0&&r<RO&&c>=0&&c<CO)grid[r][c]=t;}

// Zones ??packed tight, shifted down 2 rows for HUD space
const ZF={r1:3,c1:1,r2:9,c2:7,type:T.FARM,label:"농장"};
const ZR={r1:14,c1:1,r2:20,c2:7,type:T.RANCH,label:"가축장"};
const ZT={r1:3,c1:20,r2:8,c2:25,type:T.TRAINING,label:"훈련소"};
const ZH={r1:10,c1:21,r2:13,c2:24,type:T.HOME,label:"전투 포탈"};
const ZS={r1:15,c1:20,r2:20,c2:25,type:T.SHOP,label:"상점"};
const ZONES=[ZF,ZR,ZT,ZH,ZS];
for(const z of ZONES)fG(z.r1,z.c1,z.r2,z.c2,z.type);

// WIDE ROADS (3 tiles wide), shifted +2
fG(4,10,19,13,T.ROAD);
fG(4,10,6,19,T.ROAD);
fG(11,10,12,19,T.ROAD);
fG(17,10,19,19,T.ROAD);

fG(6,8,7,9,T.ROAD);
fG(16,8,17,9,T.ROAD);
fG(5,19,6,19,T.ROAD);
fG(11,19,12,20,T.ROAD);
fG(17,19,18,19,T.ROAD);

/* === CROP SLOTS (6횞6 inside farm) === */
const CR1=ZF.r1+1,CC1=ZF.c1+1,CRN=5,CCN=5;
const crops=[];
for(let r=0;r<CRN;r++)for(let c=0;c<CCN;c++)
  crops.push({gr:CR1+r,gc:CC1+c,state:"empty",growTimer:0,crop:null,pulse:0,sway:(r*CCN+c)*.3});

const CROP_TYPES=[
  {id:"fire_berry",seed:"fire_berry_seed",label:"불꽃 베리",element:"fire",category:"berry",grow:10,exp:10,cropIcon:"fireBerry",seedIcon:"fireBerrySeed",color:"#ef4444"},
  {id:"water_berry",seed:"water_berry_seed",label:"물 베리",element:"water",category:"berry",grow:10,exp:10,cropIcon:"waterBerry",seedIcon:"waterBerrySeed",color:"#3b82f6"},
  {id:"grass_berry",seed:"grass_berry_seed",label:"풀 베리",element:"grass",category:"berry",grow:10,exp:10,cropIcon:"grassBerry",seedIcon:"grassBerrySeed",color:"#22c55e"},
  {id:"fire_apple",seed:"fire_apple_seed",label:"불꽃 사과",element:"fire",category:"apple",grow:30,exp:100,cropIcon:"fireApple",seedIcon:"fireAppleSeed",color:"#f97316"},
  {id:"water_apple",seed:"water_apple_seed",label:"물 사과",element:"water",category:"apple",grow:30,exp:100,cropIcon:"waterApple",seedIcon:"waterAppleSeed",color:"#06b6d4"},
  {id:"grass_apple",seed:"grass_apple_seed",label:"풀 사과",element:"grass",category:"apple",grow:30,exp:100,cropIcon:"grassApple",seedIcon:"grassAppleSeed",color:"#84cc16"}
];
const HEROES=[
  {element:"fire",label:"불꽃 영웅",icon:"heroFire",battleIcon:"heroFireBattle",sprite:0,level:1,exp:0,color:"#ef4444"},
  {element:"water",label:"물 영웅",icon:"heroWater",battleIcon:"heroWaterBattle",sprite:1,level:1,exp:0,color:"#3b82f6"},
  {element:"grass",label:"풀 영웅",icon:"heroGrass",battleIcon:"heroGrassBattle",sprite:2,level:1,exp:0,color:"#22c55e"}
];
function cropDef(id){return CROP_TYPES.find(c=>c.id===id);}
function cropsByElement(element,category){return CROP_TYPES.find(c=>c.element===element&&c.category===category);}
function reqExp(hero){return 100+(hero.level-1)*50;}
function heroAttack(hero){return 10+hero.level*2;}
function heroHp(hero){return 50+hero.level*10;}
function trainingLevel(){return cl(S.trainingCenter?.level||0,0,TRAINING_MAX_LEVEL);}
function trainingNextLevel(){return Math.min(TRAINING_MAX_LEVEL,trainingLevel()+1);}
function trainingUpgradeCost(level=trainingNextLevel()){return 40+level*20+level*level*5;}
function trainingUpgradeSeconds(level=trainingNextLevel()){return 8+level*4;}
function trainingBonusPercent(level=trainingLevel()){return Math.max(0,level-1)*10;}
function trainingExpMultiplier(){return 1+trainingBonusPercent()/100;}
function boostedCropExp(crop){return Math.max(1,Math.round(crop.exp*trainingExpMultiplier()));}
function trainingJob(){return S.trainingCenter?.job||null;}
function trainingReady(){return trainingLevel()>0;}
function trainingCanStartUpgrade(){
  const level=trainingLevel(),target=level+1;
  if(trainingJob())return {ok:false,msg:"이미 건설 작업이 진행 중이에요."};
  if(level>=TRAINING_MAX_LEVEL)return {ok:false,msg:"훈련소는 이미 최대 레벨이에요."};
  if(S.level<target)return {ok:false,msg:`훈련소 ${target}레벨은 캐릭터 레벨 ${target}부터 가능해요.`};
  const cost=trainingUpgradeCost(target);
  if(S.gold<cost)return {ok:false,msg:`골드가 부족해요. 필요 골드: ${cost}`};
  return {ok:true,target,cost,seconds:trainingUpgradeSeconds(target)};
}

/* === RANCH SLOTS (2x2 square) === */
const ranch=[];
for(let r=0;r<2;r++)for(let c=0;c<2;c++){
  ranch.push({r1:ZR.r1+1+r*3,r2:ZR.r1+3+r*3,c1:ZR.c1+1+c*3,c2:ZR.c1+3+c*3,animal:null,idx:r*2+c});
}

/* === SHOP === */
const shopItems=[
  {name:"씨앗 x3",cost:12,cur:"gold",give:{seeds:3},icon:"iconPlant"},
  {name:"소 구매",cost:30,cur:"gold",give:{cow:1},icon:"cow"},
  {name:"양 구매",cost:25,cur:"gold",give:{sheep:1},icon:"sheep"},
  {name:"닭 구매",cost:15,cur:"gold",give:{chicken:1},icon:"chicken"},
  {name:"작물 판매 x5",cost:5,cur:"turnips",give:{gold:45},icon:"iconSell"},
  {name:"우유 판매 x1",cost:1,cur:"milk",give:{gold:14},icon:"milk"},
  {name:"달걀 판매 x3",cost:3,cur:"eggs",give:{gold:18},icon:"egg"},
  {name:"양털 판매 x1",cost:1,cur:"wool",give:{gold:20},icon:"fleece"},
];

const LIVESTOCK_SHOP_ITEMS=shopItems.filter(i=>i.give.cow||i.give.sheep||i.give.chicken);
const LIVESTOCK_LABELS={cow:"소",sheep:"양",chicken:"닭"};
const ANIMAL_TYPES={
  cow:{type:"cow",label:"소",icon:"cow",product:"milk",productLabel:"우유",yield:1,days:2,exp:12,color:"#64748b"},
  sheep:{type:"sheep",label:"양",icon:"sheep",product:"wool",productLabel:"양털",yield:1,days:2,exp:14,color:"#a855f7"},
  chicken:{type:"chicken",label:"닭",icon:"chicken",product:"eggs",productLabel:"달걀",yield:3,days:1,exp:10,color:"#eab308"}
};
function animalDef(type){return ANIMAL_TYPES[type]||ANIMAL_TYPES.cow;}
function animalRequiredSeconds(def){return def.days*FARM_DAY_SECONDS;}
function animalElapsedDays(animal){return Math.floor((animal.elapsed||0)/FARM_DAY_SECONDS);}
function normalizeAnimalTimer(animal,def){
  if(typeof animal.elapsed!=="number")animal.elapsed=(animal.progress||0)*FARM_DAY_SECONDS;
  animal.elapsed=cl(animal.elapsed,0,animalRequiredSeconds(def));
  animal.progress=Math.floor(animal.elapsed/FARM_DAY_SECONDS);
}
const RANCH_CAPACITY=ranch.length;
function occupiedRanchCount(){return ranch.filter(s=>s.animal).length;}
function hasRanchSpace(){return occupiedRanchCount()<RANCH_CAPACITY;}
const SELL_PRODUCTS=[
  {id:"milk",label:"우유",icon:"milk",price:14,color:"#64748b"},
  {id:"eggs",label:"달걀",icon:"egg",price:6,color:"#eab308"},
  {id:"wool",label:"양털",icon:"fleece",price:20,color:"#a855f7"}
];

/* === STATE === */
const S={
  day:1,dayElapsed:0,gold:200,exp:0,level:1,
  inv:{fire_berry_seed:3,water_berry_seed:0,grass_berry_seed:0,fire_apple_seed:0,water_apple_seed:0,grass_apple_seed:0,fire_berry:0,water_berry:0,grass_berry:0,fire_apple:0,water_apple:0,grass_apple:0,milk:0,eggs:0,wool:0,wood:2,fence:1},
  p:{r:8,c:10,f:"right"},px:10*TL+TL/2,py:8*TL+TL/2,character:{r:8,c:10,f:"right",x:10*TL+TL/2,y:8*TL+TL/2,speed:220},
  mt:null,mv:false,ms:220,trainingCenter:{level:0,job:null}, // faster movement
  et:"clear",ev:"맑음: 작물이 평소처럼 자랍니다.",
  msg:"WASD 이동 · 좌클릭 상호작용",mt2:"info",mf:0,act:"마을 진입",
  nz:null,sm:false,mi:[],mb:[],
  ss:false,shopView:"main",seedUI:null,trainUI:false,buildUI:false,_sb:[],_sc:null,_seedButtons:[],_trainButtons:[],
  dailyPopup:null,_dailyConfirm:null,
  lang:null,_languageButtons:[],_langToggle:null,tutorialStep:0,tutorialDone:false,_tutorialButtons:[],
  mx:-999,my:-999,lastCheatKeyTime:0,
  an:0,lt:0,pop:[],par:[],lp:0,wf:0,ef:0,
  keys:{},
  bs:{hero:{hp:165,mhp:165},enemy:{hp:210,mhp:210},active:false},
  stage15Cleared:false
};
S.heroes=HEROES;

Object.defineProperties(S,{
  seeds:{get(){return CROP_TYPES.reduce((n,c)=>n+(this.inv[c.seed]||0),0)},set(v){this.inv.fire_berry_seed=v}},
  turnips:{get(){return CROP_TYPES.reduce((n,c)=>n+(this.inv[c.id]||0),0)},set(v){this.inv.fire_berry=v}},
  milk:{get(){return this.inv.milk},set(v){this.inv.milk=v}},
  eggs:{get(){return this.inv.eggs},set(v){this.inv.eggs=v}},
  wool:{get(){return this.inv.wool},set(v){this.inv.wool=v}},
  wood:{get(){return this.inv.wood},set(v){this.inv.wood=v}},
  fence:{get(){return this.inv.fence},set(v){this.inv.fence=v}},
});

function characterPosition(){return{r:S.character.r,c:S.character.c,f:S.character.f};}
function restoreCharacter(position){
  S.character.r=position.r;S.character.c=position.c;S.character.f=position.f||"down";
  S.character.x=S.character.c*TL+TL/2;S.character.y=S.character.r*TL+TL/2;
}
function moveCharacter(dr,dc,dt,canOccupy){
  const distance=S.character.speed*dt;
  const nextX=S.character.x+dc*distance,nextY=S.character.y+dr*distance;
  const nextRow=Math.floor(nextY/TL),nextColumn=Math.floor(nextX/TL);
  if(!canOccupy(nextRow,nextColumn))return false;
  if(dr<0)S.character.f="up";else if(dr>0)S.character.f="down";else if(dc<0)S.character.f="left";else if(dc>0)S.character.f="right";
  S.character.x=nextX;S.character.y=nextY;S.character.r=nextRow;S.character.c=nextColumn;
  return true;
}

/* === HELPERS === */
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function lTh(){return S.level*100;}
function aP(v,x,y,c,s=16){S.pop.push({v,x,y,c,s,l:1});}
function aPa(x,y,c,n=10){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=30+Math.random()*60;S.par.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-20,r:1.5+Math.random()*2,c,l:.5+Math.random()*.3});}}
function sM(v,t="info"){S.msg=v;S.act=v;S.mt2=t;S.mf=1;}
function wr(v){sM(v,"warn");}
function gE(n){S.exp+=n;while(S.exp>=lTh()){S.exp-=lTh();S.level++;S.lp=1;aP("레벨 업!",W/2,40,"#fff7a8",20);aPa(W/2,40,"#fde047",18);}}
function grantFarmCheat(){
  S.gold+=1000;
  for(const crop of CROP_TYPES)S.inv[crop.id]=(S.inv[crop.id]||0)+100;
  aP("+1000골드",W/2,H/2-18,"#facc15",18);
  aP("6종 작물 +100",W/2,H/2+12,"#84cc16",16);
  aPa(W/2,H/2,"#facc15",24);
  sM("치트 발동! 1000골드와 모든 작물 100개를 얻었어요.");
  saveFarm();
}
function handleCheatKey(e){
  if(e.code!=="Backquote"||e.repeat)return false;
  const now=performance.now();
  if(now-S.lastCheatKeyTime<=650){
    S.lastCheatKeyTime=0;
    grantFarmCheat();
  }else{
    S.lastCheatKeyTime=now;
  }
  return true;
}
function weatherText(type){
  return {clear:"맑음: 작물이 평소처럼 자랍니다.",drought:"가뭄: 수확량 감소.",typhoon:"태풍: 가축장의 모든 가축이 사라집니다.",flood:"홍수: 심어진 작물이 모두 사라집니다."}[type]||"맑음: 작물이 평소처럼 자랍니다.";
}
function weatherName(type){
  return {clear:"맑음",drought:"가뭄",typhoon:"태풍",flood:"홍수"}[type]||"맑음";
}
function weatherEffect(type){
  return {clear:"작물이 평소처럼 자랍니다.",drought:"수확량이 감소합니다.",typhoon:"가축장의 모든 가축이 즉시 사라집니다.",flood:"밭에 심어진 모든 작물이 즉시 사라집니다."}[type]||"작물이 평소처럼 자랍니다.";
}

/* === MOVEMENT === */
function cW(r,c){if(r<0||r>=RO||c<0||c>=CO)return false;const t=grid[r][c];return t===T.ROAD||t===T.FARM||t===T.RANCH||t===T.TRAINING||t===T.HOME||t===T.SHOP;}
function syncCharacterState(){
  S.p=characterPosition();S.px=S.character.x;S.py=S.character.y;S.ms=S.character.speed;
}
function mB(dr,dc,dt){
  if(S.sm||S.ss)return false;
  const moved=moveCharacter(dr,dc,dt,cW);
  syncCharacterState();cNZ();
  return moved;
}
function cNZ(){const{r,c}=S.p;S.nz=null;for(const z of ZONES)if(r>=z.r1-1&&r<=z.r2+1&&c>=z.c1-1&&c<=z.c2+1){S.nz=z;break;}}
function getKeyDir(){
  if(S.keys.KeyW||S.keys.ArrowUp) return{dr:-1,dc:0};
  if(S.keys.KeyS||S.keys.ArrowDown) return{dr:1,dc:0};
  if(S.keys.KeyA||S.keys.ArrowLeft) return{dr:0,dc:-1};
  if(S.keys.KeyD||S.keys.ArrowRight) return{dr:0,dc:1};
  return null;
}
function hK(dt){
  const newDir=getKeyDir();
  if(S.sm||S.ss||S.showInv||S.buildUI||S.dailyPopup){S.mv=false;return;}
  S.mv=newDir ? mB(newDir.dr,newDir.dc,dt) : false;
}

/* === FARM CLICK === */
function hFC(gr,gc){
  const s=crops.find(s=>s.gr===gr&&s.gc===gc);if(!s)return;
  const px=s.gc*TL+TL/2,py=s.gr*TL+TL/2;
  if(s.state==="empty"){
    S.seedUI={plot:s,selectedCropId:null};sM("심을 씨앗을 선택하세요.");markTutorial("openSeed");
  }else if(s.state==="mature"){
    const crop=cropDef(s.crop),amt=S.et==="drought"?1:2;

function updateRanchProduction(dt){
  let readyProducts=0;
  for(const s of ranch)if(s.animal&&!s.animal.product){
    const d=animalDef(s.animal.type),need=animalRequiredSeconds(d);
    normalizeAnimalTimer(s.animal,d);
    s.animal.elapsed+=dt;
    s.animal.progress=Math.floor(s.animal.elapsed/FARM_DAY_SECONDS);
    if(s.animal.elapsed>=need){
      s.animal.elapsed=need;s.animal.progress=d.days;s.animal.product=true;readyProducts++;
    }
  }
  if(readyProducts>0){
    aP(`가축 생산물 ${readyProducts}개 준비`,W/2,H/2-22,"#f97316",13);
    sM(`가축 생산물 ${readyProducts}개가 준비됐어요.`);
  }
}

  S.dayElapsed+=dt;

  }
}

function isRoadCell(r,c){return r>=0&&r<RO&&c>=0&&c<CO&&grid[r][c]===T.ROAD;}
function roadEdgeMask(r,c){

    w:!isRoadCell(r,c-1),
    e:!isRoadCell(r,c+1)

}
function drawPavedRoadTile(x,y,r,c,alpha=1){
  const edge=roadEdgeMask(r,c);

  g.addColorStop(0,"rgba(202,205,164,.62)");

  cx.fillRect(x,y,TL,TL);
  cx.fillStyle="rgba(255,249,205,.1)";
  if((r+c)%2===0){cx.beginPath();cx.ellipse(x+TL*.52,y+TL*.44,TL*.24,1.4,.08,0,Math.PI*2);cx.fill();}
  cx.fillStyle="rgba(38,67,32,.18)";
  if(edge.n)cx.fillRect(x,y,TL,3);
  if(edge.s)cx.fillRect(x,y+TL-3,TL,3);
  if(edge.w)cx.fillRect(x,y,3,TL);

}
function drawRoadNetwork(){
  cx.save();
  cx.globalAlpha=.84;

    if(!isRoadCell(r,c))continue;
    drawPavedRoadTile(c*TL,r*TL,r,c,1);
  }
  cx.globalCompositeOperation="multiply";
  cx.fillStyle="rgba(38,67,32,.1)";
  for(let r=0;r<RO;r++)for(let c=0;c<CO;c++){
    if(!isRoadCell(r,c))continue;
    const x=c*TL,y=r*TL,edge=roadEdgeMask(r,c);
    if(edge.n){cx.beginPath();cx.ellipse(x+TL/2,y+3,TL*.48,5,0,0,Math.PI*2);cx.fill();}
    if(edge.s){cx.beginPath();cx.ellipse(x+TL/2,y+TL-3,TL*.48,5,0,0,Math.PI*2);cx.fill();}
    if(edge.w){cx.beginPath();cx.ellipse(x+3,y+TL/2,5,TL*.48,0,0,Math.PI*2);cx.fill();}
    if(edge.e){cx.beginPath();cx.ellipse(x+TL-3,y+TL/2,5,TL*.48,0,0,Math.PI*2);cx.fill();}

function upd(dt){S.an+=dt;advanceFarmClock(dt);updateRanchProduction(dt);updateTrainingConstruction(dt);if(S.dailyPopup){S.dailyPopup.remaining-=dt;if(S.dailyPopup.remaining<=0)closeDailyPopup();}S.wf=Math.max(0,S.wf-dt*1.8);S.mf=Math.max(0,S.mf-dt*2.5);S.ef=Math.max(0,S.ef-dt*1.2);S.lp=Math.max(0,S.lp-dt*1.7);

/* === INPUT === */
addEventListener("keydown",e=>{S.keys[e.code]=true;if(handleCheatKey(e))return;if(languageActive()){if(e.code==="Digit1")setLanguage("ko");else if(e.code==="Digit2"||e.code==="Enter")setLanguage("en");return;}if(e.code==="KeyL"){toggleLanguage();return;}if(S.dailyPopup&&e.code==="Escape"){closeDailyPopup();return;}if(tutorialActive()&&e.code==="Escape"){skipTutorial();return;}if(e.code==="Space"){e.preventDefault();if(!S.ss&&!S.sm&&!S.showInv&&!S.seedUI&&!S.trainUI&&!S.buildUI&&!S.dailyPopup)openMenu();}if(e.code==="KeyI"&&!S.dailyPopup)S.showInv=!S.showInv;if(S.sm&&S.mi.length){const n=parseInt(e.key);if(n>=1&&n<=S.mi.length)S.mi[n-1].f();}if(e.code==="Escape"){S.sm=false;S.ss=false;S.showInv=false;S.seedUI=null;S.trainUI=false;S.buildUI=false;}});

function pC(e){const r=cv.getBoundingClientRect();return{x:((e.clientX-r.left)/r.width)*W,y:((e.clientY-r.top)/r.height)*H};}
function ins(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
cv.addEventListener("pointermove",e=>{const p=pC(e);S.mx=p.x;S.my=p.y;});
cv.addEventListener("pointerleave",()=>{S.mx=-999;S.my=-999;});

cv.addEventListener("pointerdown",e=>{
  const p=pC(e);
  S.mx=p.x;S.my=p.y;
  if(languageActive()){const b=S._languageButtons.find(b=>ins(p,b));if(b)setLanguage(b.lang);return;}
  if(S._langToggle&&ins(p,S._langToggle)){toggleLanguage();return;}
  if(S.dailyPopup){if(S._dailyConfirm&&ins(p,S._dailyConfirm))closeDailyPopup();return;}
  if(tutorialActive()){const b=S._tutorialButtons.find(b=>ins(p,b));if(b){if(b.kind==="skip")skipTutorial();return;}}
  if(S.seedUI){if(S._seedClose&&ins(p,S._seedClose)){S.seedUI=null;return;}const b=S._seedButtons.find(b=>ins(p,b));if(b){if(b.kind==="select"){S.seedUI.selectedCropId=b.crop.id;sM(`${b.crop.label} 선택`);return;}plantSeed(S.seedUI.plot,b.crop);return;}return;}
  if(S.buildUI){if(S._buildClose&&ins(p,S._buildClose)){S.buildUI=false;return;}if(S._buildAction&&ins(p,S._buildAction)){startTrainingUpgrade();return;}return;}
  if(S.trainUI){if(S._trainClose&&ins(p,S._trainClose)){S.trainUI=false;return;}if(S._trainUpgrade&&ins(p,S._trainUpgrade)){startTrainingUpgrade();return;}const b=S._trainButtons.find(b=>ins(p,b)&&b.enabled);if(b){trainHero(b.hero,b.crop);return;}return;}
  // Inventory UI click
  if(S.showInv){if(S._invClose&&ins(p,S._invClose)){S.showInv=false;}return;}
  // Shop UI clicks
  if(S.ss){if(S._sc&&ins(p,S._sc)){S.ss=false;return;}if(S._sb){const b=S._sb.find(b=>ins(p,b)&&b.cB);if(b){if(b.back){S.shopView=b.back;return;}if(b.view){S.shopView=b.view;return;}if(b.crop){buySeed(b.crop);return;}if(b.sellAnimalType){sellAnimalType(b.sellAnimalType);return;}if(b.sellAnimal){sellAnimalSlot(b.sellAnimal);return;}if(b.sell){sellItem(b.sell);return;}if(b.it){hSB(b.it);return;}}}return;}
  // Menu clicks
  if(S.sm&&S.mb){const b=S.mb.find(b=>ins(p,b));if(b){b.fn();return;}S.sm=false;return;}
  // World click ??interaction only (no movement)
  const tc=Math.floor(p.x/TL),tr=Math.floor(p.y/TL);
  if(tr>=0&&tr<RO&&tc>=0&&tc<CO){
    const t=grid[tr][tc];
    if(t===T.FARM){const s=crops.find(s=>s.gr===tr&&s.gc===tc);if(s){const d=Math.abs(S.p.r-tr)+Math.abs(S.p.c-tc);if(d<=3){hFC(tr,tc);return;}else{sM("작물밭에 더 가까이 가세요.");return;}}}
    if(t===T.RANCH){const d=Math.abs(S.p.r-tr)+Math.abs(S.p.c-tc);if(d<=3){hRC(tr,tc);return;}else sM("가축장에 더 가까이 가세요.");}
    if(t===T.SHOP){const d=Math.abs(S.p.r-tr)+Math.abs(S.p.c-tc);if(d<=4){S.ss=true;S.shopView="main";return;}else sM("상점에 더 가까이 가세요.");}
    if(t===T.TRAINING){const d=Math.abs(S.p.r-tr)+Math.abs(S.p.c-tc);if(d<=4){openTrainingInteraction();return;}else sM("훈련소에 더 가까이 가세요.");}
    if(t===T.HOME){const d=Math.abs(S.p.r-tr)+Math.abs(S.p.c-tc);if(d<=4){openBattle();return;}else sM("전투 포탈에 더 가까이 가세요.");}
  }
});
